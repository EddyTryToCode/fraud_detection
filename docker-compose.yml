services:
  # 1. FastAPI Real-time Scoring Service
  fraud-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud-detection-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./models:/app/models:ro

  # 2. Streamlit Interactive Monitoring Dashboard
  fraud-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud-monitoring-dashboard
    restart: always
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "src/dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    depends_on:
      - fraud-api
    environment:
      - API_URL=http://fraud-api:8000
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
